<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incorporating Text editor</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/froala-editor/4.0.6/css/froala_editor.pkgd.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/froala-editor/4.0.6/css/froala_style.min.css">
</head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/froala-editor/4.0.6/js/froala_editor.pkgd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/froala-editor/4.0.6/js/froala_editor.min.js"></script>
    <textarea name="" id="editor" cols="30" rows="10"></textarea>
    <button>log</button>
    <script>
        const editor = new FroalaEditor('#editor');
        document.querySelector('button').addEventListener('click', () => {
            console.log(editor.html.get());
        });
    </script>
</body>

</html>
