<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        h1 {
            position: relative;
            animation-name: run;
            animation-duration: 2s;
            animation-fill-mode: forwards;
            animation-iteration-count: infinite;
            animation-play-state: paused;
            animation-delay: 1s;
        }

        @keyframes run {
            0% {
                left: 0%
            }

            50% {
                left: 50%
            }

            100% {
                left: 0%
            }
        }

        .container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            flex-direction: column;
        }

        .box {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            background-color: #f1f1f1;
            padding: 1rem;
            border-radius: 0.5rem;
            animation-name: hide;
            animation-duration: 5s;
            animation-play-state: paused;
            animation-delay: 0.5s;
            animation-direction: infinite;
            animation-fill-mode: none;
            transition: transform 1s ease-in-out;
        }

        @keyframes hide {
            0% {
                opacity: 1;
                padding: 1rem;
                transform: rotate(45deg);
            }

            50% {
                opacity: 0.5;

            }

            100% {
                opacity: 0;
                padding: 0;
                height: 0;
            }

        }
    </style>

</head>


<body>
    <h1>Hello world</h1>
    <button>Play</button>
    <div class="container">
    </div>
    <script>
        const posts = fetch('https://jsonplaceholder.typicode.com/posts')
            .then(response => response.json())
            .then(data => {
                data.forEach(post => {
                    const box = document.createElement('div')
                    box.className = 'box'
                    box.innerHTML += `<h2>${post.title}</h2><p>${post.body}</p> <button class="hide">Hide</button>`
                    document.querySelector('.container').appendChild(box)
                })
            });
        document.querySelector('button').onclick = () => {
            if (document.querySelector('h1').style.animationPlayState === 'paused') {
                document.querySelector('h1').style.animationPlayState = 'running';
            } else {
                document.querySelector('h1').style.animationPlayState = 'paused';
            }
        }
        document.onclick = event => {
            if (event.target.className === 'hide') {
                event.target.parentElement.style.animationPlayState = 'running';

                event.target.parentElement.addEventListener('animationend', () => {
                    event.target.parentElement.remove()
                })
            }
        }
        console.log(window.innerHeight, window.innerWidth)
        console.log('----------------------------')
        // console.log(document.body.offsetHeight)
        document.onscroll = () => {
            console.log(window.innerHeight + window.scrollY >= document.body.offsetHeight)
        }
    </script>
</body>

</html>
